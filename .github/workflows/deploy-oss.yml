name: Deploy to Aliyun OSS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oss
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Stays skipped (not failed) until the OSS_BUCKET repository variable exists,
    # so pushes are not marked red before the bucket is configured.
    if: vars.OSS_BUCKET != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install ossutil
        run: |
          curl -fsSL -o ossutil.zip \
            https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip
          unzip -q ossutil.zip
          sudo mv ossutil-2.3.0-linux-amd64/ossutil /usr/local/bin/ossutil
          ossutil version

      - name: Sync dist to OSS
        env:
          # ossutil v2 reads any OSS_-prefixed variable, so no credential ever
          # appears on the command line or in the run log.
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          # Region IDs carry no 'oss-' prefix: cn-hongkong, not oss-cn-hongkong.
          OSS_REGION: ${{ vars.OSS_REGION || 'cn-hongkong' }}
          BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          # --delete clears superseded hashed bundles from previous deploys.
          ossutil sync dist/ "oss://${BUCKET}/" --delete -f

      - name: Set cache headers
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          # Region IDs carry no 'oss-' prefix: cn-hongkong, not oss-cn-hongkong.
          OSS_REGION: ${{ vars.OSS_REGION || 'cn-hongkong' }}
          BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          set -euo pipefail
          # Vite content-hashes asset filenames, so they are safe to cache forever.
          ossutil set-props "oss://${BUCKET}/assets/" -r -f \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata-directive update
          # The HTML entry points must revalidate, or visitors keep the old bundle.
          for f in index.html 404.html; do
            ossutil set-props "oss://${BUCKET}/${f}" -f \
              --cache-control "no-cache" \
              --metadata-directive update
          done
